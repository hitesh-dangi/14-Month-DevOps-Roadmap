name:ShellCheck CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  bash-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Verify Bash Syntax Across Phase 1 & Phase 2 Scripts
        run: |
          find Phase_01_Linux_and_Bash/Capstone_Project Phase_02_Networking_Security -type f -name "*.sh" -print0 | xargs -0 -n1 bash -n
          echo "All production Bash scripts passed syntax verification!"
